<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PULSE Analysis Studio: a complete R data-analysis project on 649 Portuguese students, performed live in your browser." />
    <meta name="theme-color" content="#0B1222" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>PULSE Analysis Studio</title>
    <script>
      try {
        var t = localStorage.getItem('pulse-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
        var l = localStorage.getItem('pulse-lang');
        if (l === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><div style="min-height:100vh;display:grid;place-items:center;background:#0b1222;color:#8d99b3;font:500 14px system-ui">PULSE</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
